{{ define "main" }}
<header class="page-header container">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Params.description }}<p class="page-subtitle">{{ . }}</p>{{ end }}
</header>

<div class="page">
  {{ if .TableOfContents }}
  <aside class="toc" aria-hidden="false">
    {{ partial "toc.html" . }}
  </aside>
  {{ end }}
  <div class="content">
    {{ .Content }}
  </div>
</div>
{{ end }}
