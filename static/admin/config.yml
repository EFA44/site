# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS Configuration
# For more information, see: https://sveltia-cms-docs.netlify.app/

backend:
  name: github
  repo: EFA44/site
  branch: main
  base_url: https://efa44.org
  auth_endpoint: /oauth/authorize
  preview_context: deploy/preview

publish_mode: editorial_workflow

display_url: https://efa44.org
site_url: https://efa44.org
logo:
  src: /images/efa44-logo-small.svg

media_folder: static/files
public_folder: /files

media_libraries:
  stock_assets:
    providers: []
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

i18n:
  structure: single_file
  locales: [fr]
  default_locale: fr

collections:
  # Contenu du site
  - name: events
    label: Évènements
    label_singular: Évènement
    folder: content/events
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: events/{{slug}}
    icon: calendar_month
    summary: "{{title}} — {{date | date('DD MMM YYYY')}}"
    sortable_fields:
      fields: [date]
      default:
        field: date
        direction: descending
    view_filters:
      - { label: "À venir", field: date, gte: '{{today}}' }
      - { label: "Passés", field: date, lt: '{{today}}' }
      - { label: "Cette année", field: date, pattern: '^{{year}}' }
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: author, widget: hidden, default: EFA44 }
      - { name: date, label: Date, widget: datetime, time_format: false, default: '{{now}}' }
      - {
          name: enddate,
          label: Date de fin,
          hint: "Optionnel. Pour un événement sur plusieurs jours (ex. exposition), l'événement reste \"à venir\" jusqu'à cette date.",
          widget: datetime,
          time_format: false,
          required: false,
        }
      - {
          label: Origine,
          name: scope,
          hint: "Qui organise ? \"EFA 44\" (local) ou \"National\" (fédération EFA, même en visio ou relayé chez nous).",
          widget: select,
          default: local,
          options:
            [
              { label: "EFA 44 (local)", value: local },
              { label: "National (fédération EFA)", value: national },
            ],
        }
      - {
          label: Résumé,
          name: description,
          widget: text,
          required: false,
        }
      - {
          label: Tags,
          name: tags,
          widget: select,
          multiple: true,
          options:
            [
              conference,
              visio,
              diner,
              temoignage,
              assemblee-generale,
              pique-nique,
              projection,
              atelier,
              partenariat,
              exposition,
              adoption,
              information,
              parentalite,
              scolarite,
              journee-professionnelle,
              delaissement,
              newsletter,
              federation,
              autres,
            ],
        }
      - { label: Contenu, name: body, widget: markdown }

  - name: actualites
    label: Actualités
    label_singular: Actualité
    folder: content/actualites
    create: true
    slug: '{{year}}-{{month}}-{{slug}}'
    preview_path: actualites/{{slug}}
    icon: newspaper
    summary: "{{title}} — {{date | date('DD MMM YYYY')}}"
    sortable_fields:
      fields: [date]
      default:
        field: date
        direction: descending
    view_filters:
      - { label: "Cette année", field: date, pattern: '^{{year}}' }
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: author, widget: hidden, default: EFA 44 }
      - { name: date, label: Date, widget: datetime, time_format: false, default: '{{now}}' }
      - {
          label: Origine,
          name: scope,
          hint: "Qui publie ? \"National\" (relais d'une newsletter/actu de la fédération EFA) ou \"EFA 44\" (actualité locale).",
          widget: select,
          default: national,
          options:
            [
              { label: "National (fédération EFA)", value: national },
              { label: "EFA 44 (local)", value: local },
            ],
        }
      - {
          label: Résumé,
          name: description,
          widget: text,
          required: false,
        }
      - {
          label: Tags,
          name: tags,
          widget: select,
          multiple: true,
          required: false,
          options: [newsletter, federation, adoption, scolarite, autres],
        }
      - { label: Contenu, name: body, widget: markdown }

  - name: pages
    label: Pages
    label_singular: Page
    folder: content/pages
    create: true
    slug: '{{slug}}'
    preview_path: pages/{{slug}}
    icon: description
    fields:
      - { label: Titre, name: title, widget: string, required: true }
      - { label: Résumé, name: description, widget: text, required: true }
      - { label: Contenu, name: body, widget: markdown }

  - divider: true

  # Configuration du site
  - name: index
    label: Configuration du site
    label_singular: Configuration du site
    icon: settings
    files:
      - name: site_config
        label: Configuration générale du site
        file: config/_default/hugo.yaml
        fields:
          - { label: URL de base, name: baseURL, widget: string }
          - { label: Langue (locale), name: locale, widget: string }
          - { label: Titre du site, name: title, widget: string }
          - { label: Thème, name: theme, widget: string, required: false }
          - label: Params
            name: params
            widget: object
            fields:
              - { label: Description, name: description, widget: string }
              - { label: Slogan, name: tagline, widget: string }
              - { label: Logo (chemin), name: logo, widget: string, required: false }
              - { label: Alt du logo, name: logoAlt, widget: string, required: false }
              - { label: Favicon, name: favicon, widget: string, required: false }
              - { label: Apple icon, name: appleIcon, widget: string, required: false }
              - label: Contact
                name: contact
                widget: object
                fields:
                  - { label: Email de contact, name: email, widget: string }
                  - label: Adresse
                    name: address
                    widget: object
                    fields:
                      - { label: Nom, name: name, widget: string, required: false }
                      - { label: Rue, name: street, widget: string, required: false }
                      - { label: Ville, name: city, widget: string, required: false }
              - label: Réseaux sociaux
                name: social
                widget: object
                fields:
                  - { label: Facebook (URL), name: facebook, widget: string, required: false }
                  - { label: Instagram (URL), name: instagram, widget: string, required: false }
                  - label: Fédération
                    name: federation
                    widget: object
                    fields:
                      - { label: Nom, name: name, widget: string, required: false }
                      - { label: URL, name: url, widget: string, required: false }
      - name: index
        label: Configuration de la page d'accueil
        file: content/_index.md
        fields:
          - { label: Titre, name: title, widget: string }
          - label: Héros
            name: hero
            widget: object
            fields:
              - { label: Titre principal, name: title, widget: string }
              - { label: Texte en surbrillance, name: highlight, widget: string }
              - {
                  label: Sous-titre,
                  name: subtitle,
                  hint: "Optionnel et non affiché : la présentation de l'association se gère désormais via une diapositive « Présentation » du carrousel média.",
                  widget: text,
                  required: false,
                }
          - label: Mission
            name: mission
            widget: object
            fields:
              - { label: Titre, name: title, widget: string }
          - label: Cartes de services
            name: cards
            widget: list
            fields:
              - { label: Titre, name: title, widget: string }
              - label: Icône
                name: icon
                widget: select
                options:
                  - { label: Compas, value: compass }
                  - { label: Diplôme, value: graduation-cap }
                  - { label: Utilisateurs, value: users }
                  - { label: Microphone, value: microphone }
                  - { label: Commentaires, value: comments }
                  - { label: Palette, value: palette }
                  - { label: Enfant, value: child }
                  - { label: Livre, value: book }
                  - { label: Film, value: film }
                  - { label: Téléphone, value: phone }
              - {
                  label: Image,
                  name: image,
                  hint: "Optionnel. Si renseignée, l'image recouvre la carte ; le titre et la description apparaissent au survol.",
                  widget: image,
                  required: false,
                }
              - { label: Description, name: content, widget: text }
              - { label: Lien, name: link, widget: string }
          - label: Carrousel média
            name: mediaCarousel
            widget: object
            required: false
            fields:
              - {
                  label: Titre de la section,
                  name: title,
                  hint: "Optionnel. Laisser vide : le carrousel est intégré au bandeau d'accueil, sans titre de section.",
                  widget: string,
                  required: false,
                }
              - {
                  label: Défilement automatique,
                  name: autoplay,
                  widget: boolean,
                  default: true,
                  required: false,
                }
              - {
                  label: Intervalle (ms),
                  name: interval,
                  hint: "Durée d'affichage de chaque diapositive avant de passer à la suivante (en millisecondes).",
                  widget: number,
                  default: 12000,
                  required: false,
                }
              - label: Diapositives
                name: slides
                widget: list
                fields:
                  - label: Type
                    name: type
                    widget: select
                    default: video
                    options:
                      - { label: Présentation (texte + logo), value: presentation }
                      - { label: Vidéo (fichier), value: video }
                      - { label: YouTube, value: youtube }
                  - { label: Titre, name: title, widget: string, required: false }
                  - {
                      label: Description,
                      name: description,
                      hint: "Pour le type Présentation, c'est le texte affiché à côté du logo. Le Markdown est accepté.",
                      widget: text,
                      required: false,
                    }
                  - {
                      label: Fichier vidéo,
                      name: src,
                      hint: "Pour le type Vidéo (fichier). Sélectionnez un fichier .mp4.",
                      widget: file,
                      required: false,
                    }
                  - {
                      label: Image d'aperçu (poster),
                      name: poster,
                      hint: "Optionnel. Image affichée avant la lecture de la vidéo.",
                      widget: image,
                      required: false,
                    }
                  - {
                      label: ID YouTube,
                      name: youtubeId,
                      hint: "Pour le type YouTube. Ex. 7Xf8HpSq8pY",
                      widget: string,
                      required: false,
                    }
                  - {
                      label: Lien (bouton),
                      name: link,
                      hint: "Optionnel. Affiche un bouton sous la vidéo (ex. lien vers l'enquête).",
                      widget: string,
                      required: false,
                    }
                  - {
                      label: Libellé du bouton,
                      name: linkLabel,
                      hint: "Texte du bouton. Par défaut : « En savoir plus ».",
                      widget: string,
                      required: false,
                    }
          - label: Appel à l'action
            name: cta
            widget: object
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Texte, name: text, widget: text }
              - { label: Lien, name: link, widget: string }
              - { label: Libellé du bouton, name: label, widget: string }
      - name: medias
        label: Médias à découvrir
        file: data/medias.yaml
        fields:
          - &media_list
            label: Podcasts
            name: podcasts
            widget: list
            summary: "{{titre}}"
            fields:
              - { label: Titre, name: titre, widget: string }
              - { label: Auteur / réalisateur, name: auteur, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Image, name: image, widget: image }
              - { label: Lien, name: lien, widget: string, required: false }
          - { <<: *media_list, label: Films, name: films }
          - { <<: *media_list, label: Livres jeunesse, name: livres_jeunesse }
          - { <<: *media_list, label: Livres, name: livres }
          - { <<: *media_list, label: Séries, name: series }
          - { <<: *media_list, label: Documentaires, name: documentaires }
      - name: main_menu_footer
        label: Menu principal et Pied de page
        file: config/_default/menu.yaml
        fields:
          - label: Navigation principale
            name: navbar
            widget: list
            fields:
              - { label: Identifiant, name: identifier, widget: string }
              - { label: Nom, name: name, widget: string }
              - { label: URL, name: url, widget: string, required: false }
              - { label: Parent, name: parent, widget: string, required: false }
              - { label: Poids, name: weight, widget: number, required: false }
              - label: Params
                name: params
                widget: object
                required: false
                fields:
                  - { label: Mettre en avant, name: highlight, widget: boolean, required: false }
                  - { label: Style, name: style, widget: string, required: false }
                  - { label: Externe, name: external, widget: boolean, required: false }
                  - { label: Icône, name: icon, widget: string, required: false }
          - label: Pied de page
            name: footer
            widget: list
            fields:
              - { label: Nom, name: name, widget: string }
              - { label: URL, name: url, widget: string }
              - { label: Poids, name: weight, widget: number, required: false }
              - label: Params
                name: params
                widget: object
                required: false
                fields:
                  - { label: Externe, name: external, widget: boolean, required: false }

  # Fichiers médias : collections masquées du menu, elles servent uniquement
  # à exposer leurs dossiers dans la médiathèque (Assets).
  - name: activities
    label: Activités
    label_singular: Activité
    folder: static/files/activites
    hide: true
    create: false
    icon: folder_open
    media_folder: /static/files/activites
    public_folder: /files/activites
    fields:
      - { label: Titre, name: title, widget: string, required: true }
      - { label: Contenu, name: body, widget: markdown }

  - name: images
    label: Images
    label_singular: Image
    folder: static/images
    hide: true
    create: false
    icon: folder_open
    media_folder: /static/images
    public_folder: /images
    fields:
      - { label: Titre, name: title, widget: string, required: true }
      - { label: Contenu, name: body, widget: markdown }