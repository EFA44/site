<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // Shortcode Hugo apercu-lien (themes/efa44/layouts/shortcodes/apercu-lien.html)
      CMS.registerEditorComponent({
        id: 'apercu-lien',
        label: 'Fiche',
        icon: 'link',
        fields: [
          { name: 'url', label: 'URL', widget: 'string' },
          { name: 'titre', label: 'Titre', widget: 'string' },
          { name: 'image', label: 'Image', widget: 'image', required: false },
        ],
        pattern: /{{< apercu-lien url="(?<url>[^"]*)" titre="(?<titre>[^"]*)" image="(?<image>[^"]*)" >}}/,
        toBlock: ({ url = '', titre = '', image = '' }) =>
          `{{< apercu-lien url="${url}" titre="${titre}" image="${image}" >}}`,
        toPreview: ({ url = '', titre = '', image = '' }) =>
          `<a href="${url}" style="display:flex;align-items:center;gap:1.5rem;max-width:640px;border:1px solid #ddd;border-radius:8px;overflow:hidden;text-decoration:none;color:inherit">` +
          (image ? `<img src="${image}" alt="" style="width:120px;height:120px;object-fit:cover;flex:none">` : '') +
          `<span style="min-width:0;padding-right:1.5rem"><strong style="display:block">${titre}</strong><span style="display:block;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${url}</span></span></a>`,
      });

      // Shortcode Hugo liste-documents : la liste est générée au build (readDir),
      // l'aperçu n'affiche donc qu'un encadré indiquant le dossier listé.
      CMS.registerEditorComponent({
        id: 'liste-documents',
        label: 'Liste de documents',
        icon: 'folder_open',
        fields: [
          { name: 'dossier', label: 'Dossier', widget: 'string', hint: 'Chemin dans static/, ex. files/activites' },
          { name: 'id', label: 'Ancre', widget: 'string', required: false },
        ],
        pattern: /{{< liste-documents dossier="(?<dossier>[^"]*)"(?: id="(?<id>[^"]*)")? >}}/,
        toBlock: ({ dossier = '', id = '' }) =>
          `{{< liste-documents dossier="${dossier}"${id ? ` id="${id}"` : ''} >}}`,
        toPreview: ({ dossier = '' }) =>
          `<div style="border:1px dashed #aaa;border-radius:8px;padding:1rem">📥 Liste des documents du dossier <code>${dossier}</code> (générée à la publication)</div>`,
      });

      // Aperçu de data/medias/*.yaml avec le balisage du shortcode medias et les styles du site
      CMS.registerPreviewStyle('/admin/preview.css');
      const mediaPreview = createClass({
        render: function () {
          const { entry, getAsset } = this.props;
          const items = entry.toJS().data.items || [];
          const src = (path) => getAsset(path)?.url || path;
          const card = (m, i) =>
            h(m.lien ? 'a' : 'div', { key: i, className: 'media-item', href: m.lien || undefined, target: m.lien ? '_blank' : undefined },
              m.couleur
                ? h('div', { className: 'media-story', style: { '--c': m.couleur } },
                    h('div', { className: 'media-story__card' },
                      m.intertitre && h('span', { className: 'media-story__intertitre' }, m.intertitre),
                      h('img', { src: src(m.image), alt: '' }),
                      h('span', { className: 'media-story__title' }, m.titre),
                      h('span', { className: 'media-story__show' }, m.auteur),
                      h('img', {
                        className: 'media-story__logo',
                        src: /radiofrance\.fr/.test(m.lien) ? '/images/radiofrance.svg' : '/images/spotify.svg',
                        alt: '',
                      })))
                : h(rf, {},
                    h('img', { src: src(m.image), alt: '' }),
                    h('span', { className: 'media-item__title' }, m.titre),
                    m.auteur && h('span', { className: 'media-item__meta' }, m.auteur)),
              m.description && h('span', { className: 'media-item__meta' }, m.description));

          return h('div', { className: 'content' }, h('div', { className: 'media-grid' }, items.map(card)));
        },
      });
      ['podcasts', 'films', 'livres_jeunesse', 'livres', 'series', 'documentaires'].forEach((name) =>
        CMS.registerPreviewTemplate(name, mediaPreview));
    </script>
  </body>
</html>
