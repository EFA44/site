name: Hugo Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    branches:
      - main
  repository_dispatch:
    types: [sveltia-cms-publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: latest
          extended: true

      - name: Build Hugo site
        run: hugo --minify --environment ${{ github.event.inputs.environment || 'production' }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run Pagefind
        run: npx pagefind@latest --site "public"

      - name: Display build output
        run: |
          echo "Build completed successfully"
          du -sh public/
          find public -type f | wc -l

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL }}
          local-dir: ./public/
          dangerous-clean-slate: false

      - name: Deployment notification
        if: success()
        run: |
          echo "✓ Site deployed successfully"
          echo "Event: ${{ github.event_name }}"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Deployment failed notification
        if: failure()
        run: |
          echo "✗ Deployment failed"
          exit 1
